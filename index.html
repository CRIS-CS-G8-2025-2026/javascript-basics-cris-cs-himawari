<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Convert Celsius Temperature to Fahrenheit</title>
</head>
<body>
  <form id="tempForm" onsubmit="event.preventDefault(); convertTemp();">
    <h2>Convert Celsius Temperature to Fahrenheit</h2>
    <label for="celsius">Enter Celsius temperature:</label>
    <input type="number" id="celsius" name="celsius" step="any" required>
    <button type="submit">Calculate</button>
    <div id="result" style="margin-top:1em;"></div>
  </form>
  <script src="scripts/main.js"></script>
</body>
</html>
